# mypy.ini — Configuration for Shira Lab backend
[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
# Cross-platform: ctypes.windll/winreg exist on Windows but not Linux.
# type: ignore[attr-defined] comments are needed on Linux CI but unused on Windows.
# Setting this to False prevents false positives when running mypy on Windows.
warn_unused_ignores = False
warn_no_return = True
no_implicit_reexport = True
strict_equality = True

# External packages without stubs — ignore missing imports
ignore_missing_imports = True

# External packages — ignore missing imports (stubs not installed on CI)
[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-pynput.*]
ignore_missing_imports = True

[mypy-mss.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-serial.*]
ignore_missing_imports = True

[mypy-ctypes.wintypes]
ignore_missing_imports = True

[mypy-keyboard]
ignore_missing_imports = True

[mypy-mouse]
ignore_missing_imports = True

[mypy-config]
ignore_missing_imports = True

[mypy-utils]
ignore_missing_imports = True

[mypy-window_utils]
ignore_missing_imports = True

# numpy — stubs available via mypy built-in or numpy-stubs
[mypy-numpy]
ignore_missing_imports = True

