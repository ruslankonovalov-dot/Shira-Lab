[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shira-lab"
version = "0.17.0"
description = "Shira Lab — Terminal-style autoclicker/aimer/macro tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "pynput>=1.7.6",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pywin32>=306",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-qt>=4.3,<5.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-timeout>=2.2,<3.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-benchmark>=4.0,<5.0",
    "pyserial>=3.5,<4.0",
    "ruff>=0.5.0,<0.7.0",
    "black>=24.4,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.10,<2.0",
    "sphinx>=7.3,<9.0",
    "sphinx-rtd-theme>=2.0,<3.0",
    "myst-parser>=3.0,<5.0",
    "coverage[toml]>=7.4,<8.0",
    "pyinstaller>=6.5,<7.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # key directories that don't need strict formatting
  \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
  | data
  | logs
  | records
  | screenshots
  | \.benchmarks
)/
'''

# isort config - needed for CI isort --check step
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["app", "tests"]
skip = ["docs/refactor_target/**", "tests/unit/test_*.py", "tests/integration/*.py", "app/main.py", "app/backend/qml_bridge.py", "app/backend/controllers/gamepad_controller.py", "app/backend/controllers/profile_controller.py", "app/backend/controllers/window_controller.py", "app/backend/controllers/hotkey_controller.py", "app/backend/services/clicker_service.py", "app/backend/services/recorder_service.py", "app/backend/services/pico_service.py", "app/backend/services/macro_service.py"]

[tool.isort.sections]
THIRDPARTY = ["PySide6", "pytest", "pynput", "keyboard", "mouse", "numpy", "cv2", "mss", "PIL", "win32ctypes", "win32api", "win32gui", "win32con"]
FIRSTPARTY = ["app", "utils", "config", "window_utils", "conftest"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by black)
]
[tool.ruff.lint.per-file-ignores]
"docs/refactor_target/**" = ["F401", "I001"]
"tests/**" = ["T201", "ARG001", "ARG002", "ARG005"]
"app/backend/services/crash_reporter.py" = ["UP017"]
"app/backend/services/singleton.py" = ["UP047"]
"app/backend/controllers/gamepad_controller.py" = ["I001"]
"app/backend/controllers/profile_controller.py" = ["I001"]
"app/backend/controllers/window_controller.py" = ["I001"]
"app/backend/controllers/hotkey_controller.py" = ["I001"]
"app/backend/qml_bridge.py" = ["I001"]
"app/backend/services/clicker_service.py" = ["I001"]
"app/backend/services/recorder_service.py" = ["I001"]
"app/backend/services/pico_service.py" = ["I001"]
"app/backend/services/macro_service.py" = ["I001"]
"app/main.py" = ["I001"]
"tests/unit/test_macro_undo_redo.py" = ["I001"]
"tests/unit/test_profile_io.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
no_implicit_reexport = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "pynput.*",
    "mss.*",
    "PIL.*",
    "serial.*",
    "ctypes.wintypes",
    "keyboard",
    "mouse",
    "config",
    "utils",
    "window_utils",
    "numpy",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app", "config", "utils", "window_utils"]
omit = ["tests/*", "docs/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]