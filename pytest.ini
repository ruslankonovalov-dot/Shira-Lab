# pytest.ini — Конфигурация тестов Shira Lab
# ===================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Маркеры для категоризации тестов
markers =
    unit: Unit-тесты (быстрые, изолированные)
    integration: Интеграционные тесты (несколько модулей вместе)
    perf: Performance тесты (benchmark)
    stress: Stress тесты (нагрузочное тестирование)
    qml: QML-тесты (через pytest-qt)
    slow: Медленные тесты (>1сек)
    windows: Тесты, требующие Windows API
    skip_ci: Тесты, которые пропускаются в CI

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --showlocals
    --cov=app
    --cov=utils
    --cov=config
    --cov-report=term-missing
    --cov-report=html:tests/_coverage_html
    --cov-report=xml:tests/_coverage.xml
    --cov-fail-under=85
    --cov-branch
    --cov-config=.coveragerc
    -ra

# Минимальная версия pytest
minversion = 7.0

# Фильтры предупреждений
filterwarnings =
    error::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning
    ignore::UserWarning:PySide6.*

# Логирование
log_cli = false
log_cli_level = INFO
log_file = tests/_pytest.log
log_file_level = DEBUG
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
