[settings]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = app,tests
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
known_third_party = PySide6,pytest,pynput,keyboard,mouse,numpy,cv2,mss,PIL,win32ctypes,win32api,win32gui,win32con
known_first_party = app,utils,config,window_utils,conftest
skip = .git,.venv,venv,__pycache__,.pytest_cache,.mypy_cache,.ruff_cache,data,logs,records,screenshots,.benchmarks,docs/refactor_target/**,tests/unit/test_*.py,tests/integration/*,app/main.py,app/backend/qml_bridge.py,app/backend/controllers/gamepad_controller.py,app/backend/controllers/profile_controller.py,app/backend/controllers/window_controller.py,app/backend/controllers/hotkey_controller.py,app/backend/services/clicker_service.py,app/backend/services/recorder_service.py,app/backend/services/pico_service.py,app/backend/services/macro_service.py