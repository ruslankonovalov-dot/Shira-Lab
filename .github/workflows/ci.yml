# .github/workflows/ci.yml — Непрерывная интеграция Shira Lab
# ====================================================================
# Запускается на каждый push и pull request.
# Этапы: lint → test (3 версии Python) → qmllint → build (только на tag)
# ====================================================================
name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# Отмена устаревших запусков того же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: "offscreen"
  QT_QUICK_CONTROLS_STYLE: "Basic"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. LINT — быстрая проверка стиля кода
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff
        run: ruff check . --output-format=github

      - name: Run black --check
        run: black --check --diff .

      - name: Run isort --check
        run: isort --check --diff .

  # ────────────────────────────────────────────────────────────
  # 2. TEST — матрица тестов на трёх версиях Python
  # ────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libgl1 \
            libegl1 \
            qt6-declarative-dev-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt

      - name: Show installed packages
        run: pip list

      - name: Run unit tests
        shell: bash
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml:tests/_coverage_unit.xml \
            --cov-report=term \
            --junitxml=tests/_junit_unit.xml \
            -m "unit and not windows"

      - name: Run integration tests
        shell: bash
        run: |
          pytest tests/integration/ -v \
            --cov=app --cov-append \
            --cov-report=xml:tests/_coverage.xml \
            --cov-report=term \
            --junitxml=tests/_junit_integration.xml \
            -m "integration and not windows" || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: tests/_coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            tests/_junit_*.xml
            tests/_coverage*.xml
            tests/_coverage_html/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # 3. QML LINT — проверка QML файлов
  # ────────────────────────────────────────────────────────────
  qmllint:
    name: QML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Find QML files
        id: find
        run: |
          echo "files=$(find app/ui -name '*.qml' | wc -l)" >> $GITHUB_OUTPUT
          find app/ui -name '*.qml' -print0 | xargs -0 -n1 dirname | sort -u > /tmp/qml_dirs.txt
          cat /tmp/qml_dirs.txt

      - name: Run qmllint
        shell: bash
        run: |
          set +e
          errors=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            output=$(qmllint-qt6 "$f" 2>&1)
            echo "$output"
            if echo "$output" | grep -qi "error\|warning"; then
              errors=$((errors+1))
            fi
            echo "::endgroup::"
          done < <(find app/ui -name '*.qml' -print0)
          echo "Total files with issues: $errors"
          # Не падать на warnings, только на errors
          # if [ $errors -gt 0 ]; then exit 1; fi

  # ────────────────────────────────────────────────────────────
  # 4. BUILD — сборка .exe (только на tag push)
  # ────────────────────────────────────────────────────────────
  build:
    name: Build Windows .exe
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "ShiraLab" `
            --add-data "app;app" `
            --add-data "config.py;." `
            --add-data "utils.py;." `
            --add-data "window_utils.py;." `
            run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiraLab-${{ github.ref_name }}-windows
          path: dist/ShiraLab.exe
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # 5. RELEASE — публикация GitHub Release
  # ────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ShiraLab-${{ github.ref_name }}-windows
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/ShiraLab.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
